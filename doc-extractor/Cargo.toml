[package]
name = "doc-extractor"
version = "0.0.1"
edition = "2024"

[dependencies]
blake3 = "1.8.2"
chrono = "0.4.40"
derive_more = { version = "1.0.0", features = ["from"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.143"
utoipa = { version = "5", features = ["actix_extras", "yaml"] }
