[package]
name = "idropr-server"
version = "0.0.6"
edition = "2024"

authors = ["Josh Briggs", "Josh Briggs <josh@derivemore.com"]

[dependencies]
actix-cors = "0.7.1"
actix-rt = "2.10.0"
actix-web = "4.9.0"
aes-gcm = "0.10.3"
base64 = "0.22.1"
bcrypt = "0.17.0"
blake3 = "1.8.2"
chrono = "0.4.40"
clap = { version = "4.5.43", features = ["derive"] }
database = { path = "../database" }
email-template = { path = "../email-template" }
derive_more = { version = "1.0.0", features = ["from"] }
dotenv = "0.15.0"
email-template = { path = "../email-template"}
futures = "0.3.31"
insta = { version = "1", features = ["json"] }
postmark = { path = "../postmark" }
rand = "0.9.2"
rate-limit = { path = "../rate-limit" }
serde = { version = "1.0.218", features = ["derive"] }
sqlx = { version = "0.8.3", features = ["mysql", "runtime-async-std", "time","chrono","tls-rustls"] }
utoipa = { version = "5", features = ["actix_extras", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web", "vendored"] }
serde_json = "1.0.143"

#codegen-units = 1
#lto = false
#RUSTFLAGS="-C target-cpu=native" cargo build --release
